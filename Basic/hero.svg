<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B3FD9"/><stop offset="0.6" stop-color="#7C5CFF"/><stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/><stop offset="0.35" stop-color="#C4B5FD"/><stop offset="1" stop-color="#4C32C9"/>
    </radialGradient>
  </defs>
  <rect width="1000" height="320" rx="24" fill="url(#bg)"/>
  <g opacity="0.15" fill="#fff">
    <circle cx="80" cy="60" r="60"><animate attributeName="r" values="60;75;60" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="270" r="90"><animate attributeName="r" values="90;105;90" dur="7s" repeatCount="indefinite"/></circle>
  </g>
  <!-- Orb -->
  <g transform="translate(180,160)">
    <circle r="70" fill="url(#orb)"><animate attributeName="r" values="66;74;66" dur="3s" repeatCount="indefinite"/></circle>
    <circle r="95" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/></circle>
    <circle r="120" fill="none" stroke="#fff" stroke-opacity="0.2" stroke-width="2">
      <animate attributeName="r" values="110;130;110" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.35;0;0.35" dur="4s" repeatCount="indefinite"/></circle>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
      <circle cx="95" cy="0" r="9" fill="#fff"/><circle cx="-95" cy="0" r="7" fill="#FDE68A"/><circle cx="0" cy="-95" r="6" fill="#FCA5A5"/>
    </g>
    <!-- waveform -->
    <g fill="#4C32C9">
      <rect x="-30" y="-8" width="6" height="16" rx="3"><animate attributeName="height" values="16;44;16" dur="1s" repeatCount="indefinite"/><animate attributeName="y" values="-8;-22;-8" dur="1s" repeatCount="indefinite"/></rect>
      <rect x="-18" y="-8" width="6" height="16" rx="3"><animate attributeName="height" values="30;12;30" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="-15;-6;-15" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="-6" y="-8" width="6" height="16" rx="3"><animate attributeName="height" values="14;50;14" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="-7;-25;-7" dur="0.9s" repeatCount="indefinite"/></rect>
      <rect x="6" y="-8" width="6" height="16" rx="3"><animate attributeName="height" values="36;10;36" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="-18;-5;-18" dur="1.2s" repeatCount="indefinite"/></rect>
      <rect x="18" y="-8" width="6" height="16" rx="3"><animate attributeName="height" values="12;40;12" dur="1s" repeatCount="indefinite"/><animate attributeName="y" values="-6;-20;-6" dur="1s" repeatCount="indefinite"/></rect>
    </g>
  </g>
  <!-- Text -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#fff">
    <text x="360" y="150" font-size="84" font-weight="800" letter-spacing="2">Aivira
      <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/></text>
    <text x="364" y="196" font-size="26" font-weight="500" opacity="0.95">Your Life. Your Work. One AI.
      <animate attributeName="opacity" values="0;0.95" dur="2s" fill="freeze"/></text>
    <text x="364" y="236" font-size="18" opacity="0.8">Personal AI assistant for Hindi · English · Hinglish
      <animate attributeName="opacity" values="0;0.8" dur="3s" fill="freeze"/></text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
